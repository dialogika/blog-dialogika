<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memuat artikel… - Dialogika</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/images/favicon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fc;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1a3266;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 460px;
        background: #fff;
        border: 1px solid #e0e7ff;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 10px 30px rgba(26, 50, 102, 0.08);
      }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { margin: 0 0 16px; color: #5b6478; line-height: 1.6; font-size: 14px; }
      a { color: #1a3266; font-weight: 600; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid #e0e7ff; border-top-color: #1a3266;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box" id="message">
      <div class="spinner"></div>
      <h1>Memuat artikel…</h1>
      <p>Sebentar ya, kami sedang mengambil artikel dari server.</p>
    </div>

    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/firebase-client.js"></script>
    <script>
      (function () {
        "use strict";

        function getSlug() {
          var params = new URLSearchParams(window.location.search);
          var fromQuery = params.get("slug") || params.get("p");
          if (fromQuery) return fromQuery.trim();

          var path = window.location.pathname;
          var file = path.substring(path.lastIndexOf("/") + 1);
          file = file.replace(/\.html?$/i, "");
          if (!file || file === "article" || file === "index") return "";
          return decodeURIComponent(file);
        }

        function showMessage(title, text) {
          var box = document.getElementById("message");
          if (!box) return;
          box.innerHTML =
            "<h1>" + title + "</h1>" +
            "<p>" + text + "</p>" +
            '<p><a href="/blog/index.html">← Kembali ke daftar artikel</a></p>';
        }

        var slug = getSlug();
        if (!slug) {
          showMessage(
            "Slug artikel tidak ditemukan",
            "Alamat halaman tidak memuat nama artikel. Buka artikel lewat tautan dari daftar blog."
          );
          return;
        }

        if (!window.BlogDB || !window.BlogDB.isConfigured()) {
          showMessage(
            "Firebase belum dikonfigurasi",
            "Isi assets/js/firebase-config.js agar artikel dari database bisa ditampilkan."
          );
          return;
        }

        window.BlogDB.loadArticle(slug)
          .then(function (article) {
            if (!article || !article.html) {
              showMessage(
                "Artikel tidak ditemukan",
                "Artikel ini belum dipublikasikan atau sudah dihapus."
              );
              return;
            }
            document.open();
            document.write(article.html);
            document.close();
          })
          .catch(function (error) {
            showMessage(
              "Gagal memuat artikel",
              "Terjadi kesalahan saat mengambil data. " + (error && error.message ? error.message : "")
            );
          });
      })();
    </script>
  </body>
</html>
