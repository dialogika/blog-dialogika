<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kelola Artikel — Dialogika Admin</title>
    <link rel="icon" href="../assets/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
      :root { --primary: #1a3266; --accent: #f0a500; }
      body { background: #f0f2f5; font-family: "Segoe UI", system-ui, sans-serif; }
      .navbar-admin { background: var(--primary); padding: 12px 0; }
      .navbar-admin a, .navbar-admin span { color: #fff; text-decoration: none; }
      .navbar-admin .brand span { color: var(--accent); font-weight: 700; }
      .card-block { background: #fff; border: 1px solid #e0e7ff; border-radius: 12px; padding: 22px; }
      #login-view { max-width: 420px; margin: 80px auto; }
      .thumb { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; background: #e0e7ff; }
      .title-cell { min-width: 240px; }
    </style>
  </head>
  <body>
    <nav class="navbar-admin">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="brand" href="index.html">Dialogika <span>Admin</span></a>
        <div class="d-flex align-items-center gap-3">
          <a href="index.html">Generator</a>
          <a href="authors.html">Penulis</a>
          <span id="auth-user" class="small opacity-75"></span>
          <button class="btn btn-sm btn-outline-light d-none" id="btn-logout" type="button">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div id="message" class="alert d-none"></div>

      <div id="login-view" class="card-block">
        <h5 class="mb-3">Login Admin</h5>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" class="form-control" id="login-email" autocomplete="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required />
          </div>
          <div id="login-error" class="text-danger small mb-2"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">Login</button>
        </form>
      </div>

      <div id="app-view" class="d-none">
        <div class="card-block">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h5 class="m-0">Daftar Artikel <span id="article-count" class="text-muted fs-6"></span></h5>
            <div class="d-flex gap-2">
              <input type="search" class="form-control" id="article-search" placeholder="Cari judul…" style="max-width: 240px" />
              <a href="index.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Tulis Artikel</a>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr><th>Thumb</th><th>Judul</th><th>Kategori</th><th>Penulis</th><th>Tanggal</th><th>Status</th><th class="text-end">Aksi</th></tr>
              </thead>
              <tbody id="article-list">
                <tr><td colspan="7" class="text-center text-muted py-4">Memuat…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/firebase-client.js"></script>
    <script>
      (function () {
        "use strict";
        var articles = [];
        var query = "";
        function $(id) { return document.getElementById(id); }
        function esc(v) {
          return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
          });
        }
        function showMessage(type, html) {
          var box = $("message");
          box.className = "alert alert-" + type;
          box.innerHTML = html;
          box.classList.remove("d-none");
        }
        function formatDate(value) {
          var d = new Date(value);
          if (isNaN(d.getTime())) return esc(value || "-");
          return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
        }

        function render() {
          var tbody = $("article-list");
          var filtered = articles.filter(function (a) {
            return !query || String(a.title).toLowerCase().indexOf(query) !== -1;
          });
          $("article-count").textContent = "(" + filtered.length + ")";
          if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Tidak ada artikel.</td></tr>';
            return;
          }
          tbody.innerHTML = filtered.map(function (a) {
            var index = articles.indexOf(a);
            var thumb = a.image
              ? '<img class="thumb" src="' + esc(a.image) + '" alt="" />'
              : '<div class="thumb"></div>';
            var statusBadge = a.status === "published"
              ? '<span class="badge bg-success">Published</span>'
              : '<span class="badge bg-warning text-dark">Draft</span>';
            return "<tr>" +
              "<td>" + thumb + "</td>" +
              '<td class="title-cell"><strong>' + esc(a.title) + "</strong><div class='small text-muted'>/blog/" + esc(a.slug) + ".html</div></td>" +
              "<td>" + esc(a.category) + "</td>" +
              "<td>" + esc(a.author) + "</td>" +
              "<td>" + formatDate(a.date) + "</td>" +
              "<td>" + statusBadge + "</td>" +
              '<td class="text-end text-nowrap">' +
                '<a class="btn btn-sm btn-outline-primary me-1" href="/blog/' + esc(a.slug) + '.html" target="_blank">Lihat</a>' +
                '<button class="btn btn-sm btn-outline-secondary me-1" data-toggle="' + index + '">' +
                  (a.status === "published" ? "Jadikan Draft" : "Publish") +
                "</button>" +
                '<button class="btn btn-sm btn-outline-danger" data-delete="' + index + '">Hapus</button>' +
              "</td></tr>";
          }).join("");

          tbody.querySelectorAll("[data-toggle]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var a = articles[parseInt(btn.getAttribute("data-toggle"), 10)];
              var next = a.status === "published" ? "draft" : "published";
              btn.disabled = true;
              BlogDB.updateArticleStatus(a.slug, next)
                .then(function () { showMessage("success", "Status artikel diperbarui."); return load(); })
                .catch(function (error) { showMessage("danger", "Gagal: " + esc(error.message)); btn.disabled = false; });
            });
          });

          tbody.querySelectorAll("[data-delete]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var a = articles[parseInt(btn.getAttribute("data-delete"), 10)];
              if (!confirm('Hapus artikel "' + a.title + '"? Tindakan ini tidak bisa dibatalkan.')) return;
              btn.disabled = true;
              BlogDB.deleteArticle(a.slug)
                .then(function () { showMessage("success", "Artikel dihapus."); return load(); })
                .catch(function (error) { showMessage("danger", "Gagal: " + esc(error.message)); btn.disabled = false; });
            });
          });
        }

        function load() {
          return BlogDB.loadArticles({ includeDrafts: true }).then(function (list) {
            articles = list;
            render();
          });
        }

        function showApp(user) {
          $("login-view").classList.toggle("d-none", Boolean(user));
          $("app-view").classList.toggle("d-none", !user);
          $("btn-logout").classList.toggle("d-none", !user);
          $("auth-user").textContent = user ? user.email : "";
          if (user) load().catch(function (error) { showMessage("danger", esc(error.message)); });
        }

        $("article-search").addEventListener("input", function () {
          query = this.value.trim().toLowerCase();
          render();
        });
        $("btn-logout").addEventListener("click", function () { BlogDB.signOut(); });
        $("login-form").addEventListener("submit", function (event) {
          event.preventDefault();
          $("login-error").textContent = "";
          BlogDB.signIn($("login-email").value, $("login-password").value)
            .catch(function (error) {
              $("login-error").textContent = error.code === "auth/invalid-credential"
                ? "Email atau password salah." : (error.message || "Login gagal.");
            });
        });

        if (!BlogDB.isConfigured()) {
          $("login-view").classList.add("d-none");
          showMessage("warning", "Firebase belum dikonfigurasi. Isi <code>assets/js/firebase-config.js</code>.");
          return;
        }

        BlogDB.onAuth(showApp).catch(function (error) {
          showMessage("danger", "Firebase error: " + esc(error.message));
        });
      })();
    </script>
  </body>
</html>
