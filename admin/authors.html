<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kelola Penulis — Dialogika Admin</title>
    <link rel="icon" href="../assets/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
      :root { --primary: #1a3266; --accent: #f0a500; }
      body { background: #f0f2f5; font-family: "Segoe UI", system-ui, sans-serif; }
      .navbar-admin { background: var(--primary); padding: 12px 0; }
      .navbar-admin a, .navbar-admin span { color: #fff; text-decoration: none; }
      .navbar-admin .brand span { color: var(--accent); font-weight: 700; }
      .card-block { background: #fff; border: 1px solid #e0e7ff; border-radius: 12px; padding: 22px; margin-bottom: 22px; }
      .card-block h5 { color: var(--primary); font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 18px; }
      #login-view { max-width: 420px; margin: 80px auto; }
      .author-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #e0e7ff; }
    </style>
  </head>
  <body>
    <nav class="navbar-admin">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="brand" href="index.html">Dialogika <span>Admin</span></a>
        <div class="d-flex align-items-center gap-3">
          <a href="index.html">Generator</a>
          <a href="articles.html">Kelola Artikel</a>
          <span id="auth-user" class="small opacity-75"></span>
          <button class="btn btn-sm btn-outline-light d-none" id="btn-logout" type="button">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div id="message" class="alert d-none"></div>

      <div id="login-view" class="card-block">
        <h5><i class="bi bi-shield-lock me-2"></i>Login Admin</h5>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" class="form-control" id="login-email" autocomplete="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required />
          </div>
          <div id="login-error" class="text-danger small mb-2"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">Login</button>
        </form>
      </div>

      <div id="app-view" class="d-none">
        <div class="card-block">
          <h5><i class="bi bi-person-plus me-2"></i>Tambah / Edit Penulis</h5>
          <form id="author-form">
            <input type="hidden" id="author-id" />
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label" for="author-name">Nama *</label>
                <input type="text" class="form-control" id="author-name" required />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="author-email">Email</label>
                <input type="email" class="form-control" id="author-email" />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="author-role">Jabatan / Peran</label>
                <input type="text" class="form-control" id="author-role" placeholder="Penulis" />
              </div>
              <div class="col-md-8">
                <label class="form-label" for="author-bio">Bio Singkat</label>
                <textarea class="form-control" id="author-bio" rows="2"></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="author-photo">URL Foto</label>
                <input type="url" class="form-control" id="author-photo" placeholder="https://..." />
              </div>
              <div class="col-12 form-check ms-1">
                <input class="form-check-input" type="checkbox" id="author-active" checked />
                <label class="form-check-label" for="author-active">Aktif (muncul di pilihan penulis)</label>
              </div>
            </div>
            <div class="mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-primary" id="author-save">Simpan Penulis</button>
              <button type="button" class="btn btn-outline-secondary" id="author-reset">Reset Form</button>
            </div>
          </form>
        </div>

        <div class="card-block">
          <h5><i class="bi bi-people me-2"></i>Daftar Penulis</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr><th>Foto</th><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th class="text-end">Aksi</th></tr>
              </thead>
              <tbody id="author-list">
                <tr><td colspan="6" class="text-center text-muted py-4">Memuat…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/firebase-client.js"></script>
    <script>
      (function () {
        "use strict";
        var authors = [];
        function $(id) { return document.getElementById(id); }
        function esc(v) {
          return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
          });
        }
        function showMessage(type, html) {
          var box = $("message");
          box.className = "alert alert-" + type;
          box.innerHTML = html;
          box.classList.remove("d-none");
        }

        function renderList() {
          var tbody = $("author-list");
          if (!authors.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Belum ada penulis.</td></tr>';
            return;
          }
          tbody.innerHTML = authors.map(function (a, index) {
            var photo = a.photoURL
              ? '<img class="author-photo" src="' + esc(a.photoURL) + '" alt="' + esc(a.name) + '" />'
              : '<div class="author-photo d-flex align-items-center justify-content-center text-primary fw-bold">' + esc(a.name.charAt(0).toUpperCase()) + "</div>";
            return "<tr>" +
              "<td>" + photo + "</td>" +
              "<td><strong>" + esc(a.name) + "</strong><div class='small text-muted'>" + esc(a.bio) + "</div></td>" +
              "<td>" + esc(a.email) + "</td>" +
              "<td>" + esc(a.role) + "</td>" +
              "<td>" + (a.active ? '<span class="badge bg-success">Aktif</span>' : '<span class="badge bg-secondary">Nonaktif</span>') + "</td>" +
              '<td class="text-end">' +
                '<button class="btn btn-sm btn-outline-primary me-1" data-edit="' + index + '">Edit</button>' +
                '<button class="btn btn-sm btn-outline-danger" data-delete="' + index + '">Hapus</button>' +
              "</td></tr>";
          }).join("");

          tbody.querySelectorAll("[data-edit]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var a = authors[parseInt(btn.getAttribute("data-edit"), 10)];
              $("author-id").value = a.id;
              $("author-name").value = a.name;
              $("author-email").value = a.email;
              $("author-role").value = a.role;
              $("author-bio").value = a.bio;
              $("author-photo").value = a.photoURL;
              $("author-active").checked = a.active;
              window.scrollTo({ top: 0, behavior: "smooth" });
            });
          });

          tbody.querySelectorAll("[data-delete]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var a = authors[parseInt(btn.getAttribute("data-delete"), 10)];
              if (!confirm('Hapus penulis "' + a.name + '"?')) return;
              BlogDB.deleteAuthor(a.id)
                .then(function () { showMessage("success", "Penulis dihapus."); return load(); })
                .catch(function (error) { showMessage("danger", "Gagal menghapus: " + esc(error.message)); });
            });
          });
        }

        function resetForm() {
          $("author-id").value = "";
          $("author-form").reset();
          $("author-active").checked = true;
        }

        function load() {
          return BlogDB.loadAuthors().then(function (list) {
            authors = list;
            renderList();
          });
        }

        function showApp(user) {
          $("login-view").classList.toggle("d-none", Boolean(user));
          $("app-view").classList.toggle("d-none", !user);
          $("btn-logout").classList.toggle("d-none", !user);
          $("auth-user").textContent = user ? user.email : "";
          if (user) load().catch(function (error) { showMessage("danger", esc(error.message)); });
        }

        $("author-form").addEventListener("submit", function (event) {
          event.preventDefault();
          var payload = {
            id: $("author-id").value || undefined,
            name: $("author-name").value,
            email: $("author-email").value,
            role: $("author-role").value || "Penulis",
            bio: $("author-bio").value,
            photoURL: $("author-photo").value,
            active: $("author-active").checked,
          };
          $("author-save").disabled = true;
          BlogDB.saveAuthor(payload)
            .then(function () {
              showMessage("success", "Penulis disimpan.");
              resetForm();
              return load();
            })
            .catch(function (error) { showMessage("danger", "Gagal menyimpan: " + esc(error.message)); })
            .finally(function () { $("author-save").disabled = false; });
        });

        $("author-reset").addEventListener("click", resetForm);
        $("btn-logout").addEventListener("click", function () { BlogDB.signOut(); });

        $("login-form").addEventListener("submit", function (event) {
          event.preventDefault();
          $("login-error").textContent = "";
          BlogDB.signIn($("login-email").value, $("login-password").value)
            .catch(function (error) {
              $("login-error").textContent = error.code === "auth/invalid-credential"
                ? "Email atau password salah." : (error.message || "Login gagal.");
            });
        });

        if (!BlogDB.isConfigured()) {
          $("login-view").classList.add("d-none");
          showMessage("warning", "Firebase belum dikonfigurasi. Isi <code>assets/js/firebase-config.js</code>.");
          return;
        }

        BlogDB.onAuth(showApp).catch(function (error) {
          showMessage("danger", "Firebase error: " + esc(error.message));
        });
      })();
    </script>
  </body>
</html>
